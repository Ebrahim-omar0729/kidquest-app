name: kidquest
description: "KidQuest - Reward Tasks: a fun, colorful chore & reward app for families."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.10.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.6

  # State management
  provider: ^6.1.2

  # Local storage
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  shared_preferences: ^2.2.3

  # Reports
  pdf: ^3.10.8
  csv: ^6.0.0
  path_provider: ^2.1.3
  share_plus: ^7.2.2

  # Media
  image_picker: ^1.1.2
  flutter_svg: ^2.0.10+1

  # Charts & UX
  fl_chart: ^0.68.0
  intl: ^0.19.0
  uuid: ^4.4.0
  crypto: ^3.0.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true

