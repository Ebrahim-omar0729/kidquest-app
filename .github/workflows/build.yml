name: Build KidQuest APK

on:
  push:
    branches: [main, master]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write   # needed to publish the APK to a GitHub Release

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      # Regenerate native Android/iOS boilerplate from Flutter's official templates
      # (does not touch lib/, pubspec.yaml or assets/).
      - name: Generate platform scaffolding
        run: |
          rm -rf android ios test
          flutter create . --platforms=android,ios --project-name kidquest --org com.kidquest
          rm -rf test   # drop Flutter's sample counter test; it does not match this app

      - name: Raise Android compileSdk (plugins need 35/36)
        run: |
          python3 - << 'PY'
          import re, pathlib
          for name in ("android/app/build.gradle.kts", "android/app/build.gradle"):
              f = pathlib.Path(name)
              if not f.exists():
                  continue
              t = f.read_text()
              t = re.sub(r"compileSdk\s*=?\s*flutter\.compileSdkVersion", "compileSdk = 36" if name.endswith(".kts") else "compileSdk 36", t)
              t = re.sub(r"compileSdkVersion\s*=?\s*flutter\.compileSdkVersion", "compileSdkVersion 36", t) if not name.endswith(".kts") else t
              f.write_text(t)
              print("patched", name)
              print([l for l in t.splitlines() if "compileSdk" in l])
          PY

      - run: flutter pub get
      - run: flutter analyze --no-fatal-infos --no-fatal-warnings
      - run: flutter build apk --release

      - name: Name the APK
        run: cp build/app/outputs/flutter-apk/app-release.apk KidQuest-${{ github.run_number }}.apk

      - uses: actions/upload-artifact@v4
        with:
          name: KidQuest-apk
          path: KidQuest-${{ github.run_number }}.apk

      # Every push to main also publishes a "latest" release with the APK attached
      - name: Publish release
        if: github.event_name == 'push'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || format('build-{0}', github.run_number) }}
          name: KidQuest build ${{ github.run_number }}
          files: KidQuest-${{ github.run_number }}.apk

  ios:
    # Unsigned iOS build; run manually from the Actions tab (macOS minutes cost more).
    if: github.event_name == 'workflow_dispatch'
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: |
          rm -rf android ios
          flutter create . --platforms=android,ios --project-name kidquest --org com.kidquest
      - run: flutter pub get
      - run: flutter build ios --release --no-codesign
      - run: |
          mkdir -p Payload && cp -R build/ios/iphoneos/Runner.app Payload/
          zip -r Runner-unsigned.ipa Payload
      - uses: actions/upload-artifact@v4
        with:
          name: ios-unsigned-ipa
          path: Runner-unsigned.ipa
